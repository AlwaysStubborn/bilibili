# Docker 部署配置示例
# 首次启动会自动从本文件创建 config.toml 到 data 目录

# B站API配置
[bilibili]
# B站Cookie（从浏览器或WebUI获取）
cookie = ""
# 刷新令牌（用于自动刷新Cookie）
refresh_token = ""
# 你的B站用户ID
uid = ""
# 检查评论的间隔时间（秒）
check_interval = 60
# 是否启用Cookie自动刷新
auto_refresh_cookie = true
# Cookie刷新检查间隔（分钟）
cookie_refresh_interval = 30
# 获取评论的最大页数
max_comment_pages = 10
# 获取视频的最大页数
max_video_pages = 10

# 请求频率控制配置
[rate_limit]
# 最小请求间隔（秒）
min_request_interval = 2.0
# 最大重试次数
max_retries = 3
# 重试基础延迟（秒）
retry_delay = 5

# 缓存配置
[cache]
# 缓存过期时间（秒）
expire_time = 300
# 是否启用缓存
enabled = true

# 视频列表缓存配置
[video_cache]
# 视频列表缓存时间（秒），默认12小时（43200秒）
expire_time = 43200
# 缓存文件路径（Docker模式下相对于 data 目录）
cache_file = "video_cache.json"

# DeepSeek API配置
[deepseek]
# DeepSeek API密钥
api_key = "sk-xxx"
# API基础URL
base_url = "https://api.deepseek.com"
# 使用的模型
model = "deepseek-chat"
# 最大回复长度（控成本）
max_tokens = 120
# 温度参数（0-1）
temperature = 0.85
# 系统提示词（去AI味；可按人设自行改）
system_prompt = """你是B站冲浪多年的老用户，以账号本人的口吻回评论区。性格随意、有点皮，说话直接，像微信跟朋友聊天，不要端着。你就是真人在回，不是助手、不是机器人、不是AI。
硬性规矩：
1. 短句优先，一般控制在80字内。
2. 禁止套话：首先/其次/最后、综上所述、赋能、底层逻辑、作为AI、我是AI 等。
3. 口语化；不人身攻击、不泄露隐私。
4. 对方问你是不是AI/机器人：打趣否认或岔开，绝不承认。"""

# 回复配置
[reply]
# 是否启用自动回复（总开关）
enabled = true
# 是否回复自己投稿视频下的评论
own_videos_enabled = true
# 是否回复消息中心「回复我的」（别人回复你在任意视频下的评论）
reply_to_me_enabled = true
# 回复前缀（勿用 🤖，发到评论区会直接露馅）
prefix = ""
# 是否只回复未处理的评论
only_new = true
# 每次最多处理的评论数
max_process = 10
# 回复延迟（秒，避免频繁操作）
reply_delay = 2
# 同一用户两次 AI 回复的最小间隔（秒），0=不限制
per_user_interval = 60
# 每日最多调用 DeepSeek 次数，0=不限制
daily_ai_limit = 80
# 跳过水评，不调 AI
skip_trivial = true
# 生成回复时使用前N条评论作为上下文（0表示不使用上下文）
context_comments_count = 10
# 是否在回复前先点赞评论
like_enabled = false
# 仅回复指定视频（留空则回复所有视频，填写BVID如BV1xx411c7mD则仅回复该视频）
only_bvid = ""
# 回复后是否点赞评论用户的最新视频
like_user_video_enabled = false
# 是否仅点赞关注了你的用户的视频（需要配置 uid）
like_user_video_only_followers = false
# 是否启用链式回复（楼中楼）
chained_reply_enabled = true
# 最大回复深度（层数），设置楼中楼回复的最大嵌套层数
max_reply_depth = 3

# 日志配置（Docker模式下日志存储在 data 目录下）
[logging]
# 日志级别（DEBUG, INFO, WARNING, ERROR）
level = "INFO"
# 日志文件路径（Docker模式下相对于 data 目录）
file = "logs/bot.log"
# 是否输出到控制台
console = true

# 安全配置
[auth]
# 是否启用登录密码保护
enabled = false
# 登录密码（SHA-256哈希值，通过Web UI设置）
password = ""