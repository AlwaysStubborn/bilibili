# B站评论自动回复机器人配置文件

# B站API配置
[bilibili]
# B站Cookie（从浏览器获取）
cookie = ""
# 刷新令牌（用于自动刷新Cookie）
refresh_token = ""
# 你的B站用户ID
uid = ""
# 检查评论的间隔时间（秒）
check_interval = 60
# 是否启用Cookie自动刷新
auto_refresh_cookie = true
# Cookie刷新检查间隔（分钟）
cookie_refresh_interval = 30
# 获取评论的最大页数
max_comment_pages = 10
# 获取视频的最大页数
max_video_pages = 10

# 请求频率控制配置
[rate_limit]
# 最小请求间隔（秒）
min_request_interval = 2.0
# 最大重试次数
max_retries = 3
# 重试基础延迟（秒）
retry_delay = 5

# 缓存配置
[cache]
# 缓存过期时间（秒）
expire_time = 300
# 是否启用缓存
enabled = true

# 视频列表缓存配置
[video_cache]
# 视频列表缓存时间（秒），默认12小时（43200秒）
expire_time = 43200
# 缓存文件路径
cache_file = "video_cache.json"

# DeepSeek API配置
# 也可用环境变量覆盖敏感项：DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL / DEEPSEEK_MODEL
[deepseek]
# DeepSeek API密钥（也可用环境变量 DEEPSEEK_API_KEY）
api_key = "sk-xxx"
# API基础URL
base_url = "https://api.deepseek.com"
# 使用的模型（常用：deepseek-chat；也可试 deepseek-reasoner）
model = "deepseek-chat"
# 最大回复长度（deepseek-v4-flash 等推理模型建议 >=1024，过小会导致 content 为空）
max_tokens = 1024
# 温度参数（0-1，略高更口语）
temperature = 0.85
# 系统提示词（去AI味；可按人设自行改）
system_prompt = """你是B站冲浪多年的老用户，以账号本人的口吻回评论区。性格随意、有点皮，说话直接，像微信跟朋友聊天，不要端着。你就是真人在回，不是助手、不是机器人、不是AI。
硬性规矩：
1. 短句优先，一般控制在80字内；一句话能说清就别拆两句。
2. 绝对禁止：首先/其次/最后、综上所述、总而言之、值得注意的是、不可否认、赋能、底层逻辑、深度剖析、作为AI、我是AI、我是机器人、语言模型、DeepSeek、ChatGPT、很高兴为你服务、希望我的回答对你有帮助。
3. 可自然用「哈哈」「确实」「懂了」，别每句都用，别硬玩梗。
4. 不人身攻击、不泄露隐私、不承诺做不到的事。
5. 对方只是水评时，用极短一句带过即可。
6. 若对方问「你是不是AI/机器人/自动回复」：用人会说的话打趣否认或岔开，绝不承认、不半开玩笑坦白、不解释模型/接口/提示词。可回类似「？你才是」「打字快就叫AI啊」这种，别端着。"""

# 回复配置
[reply]
# 是否启用自动回复（总开关）
enabled = true
# 是否回复自己投稿视频下的评论
own_videos_enabled = true
# 是否回复消息中心「回复我的」（别人回复你在任意视频下的评论）
reply_to_me_enabled = true
# 回复前缀（勿用 🤖，发到评论区会直接露馅）
prefix = ""
# 是否只回复未处理的评论
only_new = true
# 每次最多处理的评论数
max_process = 10
# 回复延迟（秒，避免频繁操作）
reply_delay = 2
# 同一用户两次 AI 回复的最小间隔（秒），0=不限制
per_user_interval = 60
# 每日最多调用 DeepSeek 次数，0=不限制
daily_ai_limit = 80
# 跳过「哈哈哈」「111」等水评，不调 AI
skip_trivial = true
# 用账号本人历史回复定人设：生成时注入范本；可在 Web UI 一键生成提示词
style_from_history = true
# 最多保留多少条本人历史回复作范本
style_sample_limit = 24
# 写入 system_prompt / 注入生成时最多带几条范例
style_prompt_examples = 12
# 生成回复时使用前N条评论作为上下文（0表示不使用上下文）
context_comments_count = 10
# 仅回复指定视频（留空则回复所有视频，填写BVID如BV1xx411c7mD则仅回复该视频）
only_bvid = ""
# 回复后是否点赞评论用户的最新视频
like_user_video_enabled = false
# 是否仅点赞关注了你的用户的视频（需要配置 uid）
like_user_video_only_followers = false
# 是否启用链式回复（楼中楼）
chained_reply_enabled = true
# 最大回复深度（层数），设置楼中楼回复的最大嵌套层数
max_reply_depth = 3

# 关键词过滤
[reply.keyword_filter]
# 启用关键词过滤
enabled = false
# 白名单关键词（逗号分隔），评论必须匹配才回复；留空则不限制
whitelist = ""
# 黑名单关键词（逗号分隔），匹配任一则跳过
blacklist = "广告,加我,微信"
# 白名单匹配模式：any（任一匹配）或 all（全部匹配）
mode = "any"
# 是否区分大小写
match_case = false

# 评论长度过滤
[reply.length_filter]
# 启用长度过滤
enabled = false
# 最短长度（0=不限制）
min_length = 2
# 最长长度（0=不限制）
max_length = 500

# 用户过滤
[reply.user_filter]
# 启用用户过滤
enabled = false
# 白名单 UID（逗号分隔），仅回复这些用户
whitelist = ""
# 黑名单 UID（逗号分隔），屏蔽这些用户
blacklist = ""

# 日志配置
[logging]
# 日志级别（DEBUG, INFO, WARNING, ERROR）
level = "INFO"
# 日志文件路径
file = "logs/bot.log"
# 是否输出到控制台
console = true

# 安全配置
[auth]
# 是否启用登录密码保护
enabled = false
# 登录密码（SHA-256哈希值，通过Web UI设置）
password = ""